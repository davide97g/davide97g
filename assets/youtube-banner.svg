<svg width="880" height="150" viewBox="0 0 880 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="youtube.com/@davideghi — live builds every week">
  <!--
    duck/ui sticker card. The frame speaks duck (dark card, 3px edge, lime HUD);
    the play glyph stays YouTube red, because that red is what tells a reader
    which platform the card points at.
  -->
  <defs>
    <linearGradient id="ytEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272c"/>
      <stop offset="45%" stop-color="#cbda42"/>
      <stop offset="100%" stop-color="#27272c"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ytRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbda42"/>
      <stop offset="100%" stop-color="#cbda42" stop-opacity="0"/>
    </linearGradient>

    <filter id="ytSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="872" height="142" rx="20" fill="#121216" stroke="url(#ytEdge)" stroke-width="3"/>

  <!-- play button, one pulse -->
  <g transform="translate(80,75)">
    <circle r="40" fill="#ff0033" opacity="0.14">
      <animate attributeName="r" values="40;50;40" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.14;0.03;0.14" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="32" fill="#ff0033" filter="url(#ytSoft)"/>
    <path d="M -8 -14 L 16 0 L -8 14 Z" fill="#ffffff"/>
  </g>

  <text x="146" y="60" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#f3f3f6">youtube.com/<tspan fill="#cbda42">@davideghi</tspan></text>
  <text x="146" y="88" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="15" fill="#9797a0">Live coding · agent workflows · honest model comparisons — weekly, unedited</text>

  <rect x="146" y="100" width="0" height="3" rx="1.5" fill="url(#ytRule)">
    <animate attributeName="width" values="0;470;470;0" keyTimes="0;0.35;0.8;1" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.16 1 0.3 1;0 0 1 1;0.16 1 0.3 1"/>
  </rect>

  <g transform="translate(836,34)">
    <!-- Offset by roughly the label's rendered width, since the text is
         right-anchored and SVG cannot measure it. -->
    <rect x="-190" y="-9" width="6" height="6" fill="#cbda42">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#cbda42">BUILDING IN PUBLIC</text>
  </g>
</svg>
