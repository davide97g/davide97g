<svg width="820" height="150" viewBox="0 0 820 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#6C63FF;#FF0000" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6C63FF">
        <animate attributeName="stop-color" values="#6C63FF;#FF0000;#6C63FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="3" y="3" width="814" height="144" rx="18" fill="url(#glow)" stroke="url(#border)" stroke-width="2.5"/>

  <!-- pulsing play button -->
  <g transform="translate(75,75)">
    <circle r="42" fill="#FF0000" opacity="0.15">
      <animate attributeName="r" values="42;52;42" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0.15;0.03;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="34" fill="#FF0000" filter="url(#soft)">
      <animate attributeName="r" values="34;36;34" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <path d="M -9 -15 L 17 0 L -9 15 Z" fill="#FFFFFF"/>
  </g>

  <!-- LIVE dot -->
  <g transform="translate(745,32)">
    <circle r="5" fill="#FF4444">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="-14" y="4" text-anchor="end" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#FF4444">BUILDING IN PUBLIC</text>
  </g>

  <!-- text -->
  <text x="145" y="62" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#818CF8">youtube.com/@davideghi</text>
  <text x="145" y="94" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#8B949E">Live builds · open-source projects · AI &amp; web dev — new videos every week</text>

  <!-- animated underline -->
  <rect x="145" y="106" width="0" height="3" rx="1.5" fill="url(#border)">
    <animate attributeName="width" values="0;480;480;0" keyTimes="0;0.4;0.8;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.25 0.1 0.25 1;0 0 1 1;0.25 0.1 0.25 1"/>
  </rect>
</svg>
