<svg width="880" height="90" viewBox="0 0 880 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Built with duck/ui">
  <!-- HoloSeparator, drawn: a holo hairline with a HUD caption sitting in it. -->
  <defs>
    <linearGradient id="footHolo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c27dff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#5fb6ff"/>
      <stop offset="50%" stop-color="#00d9d9"/>
      <stop offset="75%" stop-color="#70ec90"/>
      <stop offset="100%" stop-color="#cbda42" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="20" y="44" width="300" height="1.5" fill="url(#footHolo)"/>
  <rect x="560" y="44" width="300" height="1.5" fill="url(#footHolo)"/>

  <text x="440" y="49" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.2" fill="#9797a0">BUILT WITH DUCK/UI</text>
</svg>
