<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="135" height="40" viewBox="0 0 135 40" fill="none" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>
@font-face{font-family:"Geist";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"Geist",ui-sans-serif,system-ui,sans-serif;font-kerning:normal}
.m{font-family:"Geist Mono",ui-monospace,monospace}

.rise{animation:rise 700ms cubic-bezier(0.16, 1, 0.3, 1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.fade{animation:fade 900ms ease-out both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes fade{from{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 520ms cubic-bezier(0.34, 1.56, 0.64, 1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(3)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{opacity:.5;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.55)}}
.caret{animation:caret 1.1s steps(2,start) infinite}
@keyframes caret{to{visibility:hidden}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s cubic-bezier(0.16, 1, 0.3, 1) 300ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.shine{animation:shine 7s cubic-bezier(0.16, 1, 0.3, 1) 1.2s infinite}
@keyframes shine{0%{transform:none}18%,100%{transform:translateX(var(--travel))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}

.nudge{animation:nudge 5s cubic-bezier(.16,1,.3,1) 2s infinite}
@keyframes nudge{0%,12%,100%{transform:none}6%{transform:translate(2px,-2px)}}
.shine{animation-delay:3s}
</style>

<clipPath id="pc"><rect x="1" y="1" width="133" height="38" rx="12"/></clipPath>
<rect x="1" y="1" width="133" height="38" rx="12" fill="#161616" stroke="#262626"/>
<g clip-path="url(#pc)"><polygon class="shine" style="--travel:225px" points="-70,40 -50,0 -10,0 -30,40" fill="url(#ps)"/></g>
<linearGradient id="ps" x1="0" x2="1"><stop offset="0" stop-color="#fafafa" stop-opacity="0"/><stop offset=".5" stop-color="#fafafa" stop-opacity=".22"/><stop offset="1" stop-color="#fafafa" stop-opacity="0"/></linearGradient>
<g transform="translate(17 12) scale(0.6666666666666666)" stroke="#fafafa" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><path d="M2 9h4v12H2z"/><path d="M4 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></g>
<text x="42" y="25" font-size="13.5" font-weight="500" fill="#fafafa" class="">LinkedIn</text>
<g class="nudge"><g transform="translate(103.60849999999999 14) scale(0.5)" stroke="#6b6b6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g></g>
</svg>
