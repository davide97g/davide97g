name: Deploy profile site

on:
  push:
    branches: [master]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — the action reads package.json's `packageManager`,
      # and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # The profile repo is served from /davide97g on github.io, so every asset
      # and in-page link needs that prefix. Drop this to deploy at a root.
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /davide97g

      # Pages runs Jekyll by default, which drops any path starting with an
      # underscore — that would delete the whole /_next directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
